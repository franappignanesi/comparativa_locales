name: Deploy application with current price data

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-production:
    name: Build and deploy current application
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: vercel-production-deploy
      cancel-in-progress: false
    env:
      GLITCHPRICE_PUBLIC_CACHE_SOURCE: file
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SUPPORT_LARGE_FUNCTIONS: "1"
      DIGITAL_VAT_RATE: ${{ secrets.DIGITAL_VAT_RATE }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Restore latest public dataset
        id: public-data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/generated/game-sample.json
            data/generated/latest-prices*.json
            data/generated/price-history*.json
            data/generated/itad-history*.json
            data/generated/itad-full-history*.json
            data/generated/pending-releases.json
            data/generated/steam-sale-refresh-cursor-*.json
          key: barateam-public-data-${{ github.run_id }}-deploy
          restore-keys: |
            barateam-public-data-
      - name: Skip stale-data deployment before cache bootstrap
        if: steps.public-data.outputs.cache-matched-key == ''
        run: echo "No durable public dataset exists yet; Vercel Git deployment remains authoritative."
      - uses: actions/setup-node@v6.4.0
        if: steps.public-data.outputs.cache-matched-key != ''
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.public-data.outputs.cache-matched-key != ''
      - name: Link Vercel project
        if: steps.public-data.outputs.cache-matched-key != ''
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          mkdir -p .vercel
          node -e "const fs=require('fs'); fs.writeFileSync('.vercel/project.json', JSON.stringify({ orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID }) + '\n')"
      - name: Install Vercel CLI
        if: steps.public-data.outputs.cache-matched-key != ''
        run: npm install -g vercel@latest
      - name: Pull Vercel production env
        if: steps.public-data.outputs.cache-matched-key != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel artifact
        if: steps.public-data.outputs.cache-matched-key != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy current application and dataset
        if: steps.public-data.outputs.cache-matched-key != ''
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
