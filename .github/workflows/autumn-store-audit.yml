name: Audit Shux autumn store matches

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autumn-store-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact game identities, regional stores and Microsoft PC purchases
        run: npx tsx scripts/audit-autumn-stores.ts
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autumn-store-audit
          path: artifacts/autumn-store-audit.json
          retention-days: 14
          if-no-files-found: warn
