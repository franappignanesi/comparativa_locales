name: Discord weekly offers
on:
  push:
    branches: [main]
    paths: [data/shux-weekend-games.json]
  workflow_run:
    workflows: [Import Shux weekend games]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only; do not publish to Discord"
        type: boolean
        default: true
      test_publish:
        description: "Send one extra TEST message to the channel (requires preview unchecked)"
        type: boolean
        default: false
  schedule:
    # Monday 17:15 Argentina fallback, in the same editorial cycle as the weekend.
    - cron: "15 20 * * 1"
permissions:
  contents: read
concurrency:
  group: discord-weekly-offers
  cancel-in-progress: false
jobs:
  weekly:
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.DISCORD_WEEKLY_ENABLED == '1') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GLITCHPRICE_PUBLIC_CACHE_SOURCE: file
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_WEEKLY_WEBHOOK_URL: ${{ secrets.DISCORD_WEEKLY_WEBHOOK_URL }}
      DISCORD_SEND_ENABLED: ${{ vars.DISCORD_SEND_ENABLED || '0' }}
      DISCORD_WEEKLY_ENABLED: ${{ vars.DISCORD_WEEKLY_ENABLED || '0' }}
      DISCORD_TEST_MODE: ${{ vars.DISCORD_TEST_MODE || '1' }}
      DISCORD_TEST_USER_IDS: ${{ secrets.DISCORD_TEST_USER_IDS }}
      DISCORD_DAILY_SEND_LIMIT: ${{ vars.DISCORD_DAILY_SEND_LIMIT || '100' }}
      DISCORD_WEEKLY_TEST_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.test_publish && github.run_id || '' }}
      DISCORD_WEEKLY_REQUIRE_CURRENT_JDF: ${{ (github.event_name == 'workflow_run' || github.event_name == 'push') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: main
      - uses: actions/cache/restore@v4
        id: prices
        with:
          path: |
            data/generated/game-sample.json
            data/generated/latest-prices*.json
            data/generated/price-history*.json
            data/generated/price-history*.json.gz
            data/generated/itad-history*.json
            data/generated/itad-full-history*.json
            data/generated/pending-releases.json
            data/generated/steam-sale-refresh-cursor-*.json
          key: barateam-public-data-${{ github.run_id }}-discord
          restore-keys: barateam-public-data-
          fail-on-cache-miss: true
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Discord message formatting and selection
        run: npx tsx --test scripts/discord.test.ts scripts/discord-weekly.test.ts
      - name: Build weekly digest
        id: digest
        run: ${{ inputs.preview && 'npm run notifications:discord-weekly -- --preview' || 'npm run notifications:discord-weekly' }}
      - name: Publish queued digest
        if: steps.digest.outputs.dispatch == 'true' && inputs.preview != true && vars.DISCORD_SEND_ENABLED == '1' && vars.DISCORD_WEEKLY_ENABLED == '1'
        run: npm run notifications:discord
